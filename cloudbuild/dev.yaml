###############################################################################
# Cloud Build — dev environment
# Trigger: push to `main` (single-env convention today; see README)
#
# This deploys a Cloud Run **Job**, not a Service. The job has no HTTP
# surface, no port, no ingress. It is started only via the Cloud Run
# Admin API (`jobs:run`) by gub-admin's Sync handler or the ingestion
# script. There is no Cloud Scheduler — enqueue is the trigger.
#
# Substitutions:
#   _REGION             e.g. us-central1
#   _AR_REPO            Artifact Registry repo (gub-research-worker)
#   _JOB                Cloud Run Job name (gub-research-worker-dev)
#   _DB_SECRET          Secret Manager name for DATABASE_URL
#   _PERPLEXITY_SECRET  Secret Manager name for PERPLEXITY_API_KEY
#   _CLOUDSQL_INSTANCE  Cloud SQL instance ID (gub-platform)
###############################################################################

substitutions:
  _REGION: us-central1
  _AR_REPO: gub-research-worker
  _JOB: gub-research-worker-dev
  _DB_SECRET: gub-research-worker-db-url-dev
  _PERPLEXITY_SECRET: gub-research-worker-perplexity-api-key-dev
  _CLOUDSQL_INSTANCE: gub-platform

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  # ── 1. Type check ─────────────────────────────────────────────────────────
  - id: typecheck
    name: node:22-slim
    entrypoint: sh
    secretEnv: [GH_PACKAGES_TOKEN]
    args:
      - -c
      # Token goes to ~/.npmrc (never the workspace copy — the Docker build
      # context must stay token-free; the image gets it via BuildKit secret).
      - echo "//npm.pkg.github.com/:_authToken=$$GH_PACKAGES_TOKEN" > ~/.npmrc && npm ci && npx prisma generate && npx tsc --noEmit

  # ── 2. Build image ────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    secretEnv: [GH_PACKAGES_TOKEN]
    args:
      - build
      # Dockerfile mounts this for its npm ci and scrubs it — the token
      # never lands in an image layer.
      - --secret
      - id=gh_packages_token,env=GH_PACKAGES_TOKEN
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_JOB:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_JOB:latest
      - .
    waitFor: [typecheck]

  # ── 3. Push image ─────────────────────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_JOB
    waitFor: [build]

  # ── 4. Deploy the Cloud Run Job ───────────────────────────────────────────
  # Job posture:
  #   --tasks=1 --parallelism=1   one container per execution; in-process
  #                               concurrency (RESEARCH_MAX_CONCURRENCY) is
  #                               the real parallelism knob, not Cloud Run.
  #   --max-retries=0             app-level backoff in research_jobs is the
  #                               retry mechanism; a Cloud Run task retry
  #                               would just re-drain (idempotent) — we
  #                               don't want it pile-driving.
  #   --task-timeout=86400s       outer guard only. The per-call
  #                               AbortController (RESEARCH_CALL_TIMEOUT_S)
  #                               is the real timeout; this just bounds a
  #                               wedged process.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - $_JOB
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_JOB:$SHORT_SHA
      - --region=$_REGION
      - --tasks=1
      - --parallelism=1
      - --max-retries=0
      - --task-timeout=86400s
      - --memory=512Mi
      - --cpu=1
      - --service-account=sa-$_JOB@$PROJECT_ID.iam.gserviceaccount.com
      - --set-cloudsql-instances=$PROJECT_ID:$_REGION:$_CLOUDSQL_INSTANCE
      - --set-env-vars=NODE_ENV=production,RESEARCH_CALL_TIMEOUT_S=900,RESEARCH_STALE_RUNNING_S=1200,RESEARCH_MAX_CONCURRENCY=3
      - --set-secrets=DATABASE_URL=$_DB_SECRET:latest,PERPLEXITY_API_KEY=$_PERPLEXITY_SECRET:latest
    waitFor: [push]

# @anomaly-technology/gub-schemas lives on GitHub Packages (private registry),
# so every `npm ci` — the typecheck step and the one inside the Docker build —
# needs a read:packages token. Same token as GHA CI's GH_PACKAGES_TOKEN repo
# secret; stored in Secret Manager for Cloud Build. See gub-schemas SETUP.md.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gub-gh-packages-token-dev/versions/latest
      env: GH_PACKAGES_TOKEN
