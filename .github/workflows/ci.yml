# CI — build / type check.
#
# `npm run build` is `prisma generate && tsc`, which doubles as the type
# check — same gate as the typecheck step in cloudbuild/*.yaml. There are no
# tests yet. ESLint + Prettier are configured (lint is currently clean); add
# a lint step when ready to enforce.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @anomaly-technology/gub-schemas lives on GitHub Packages under the
      # Anomaly-Technology org (different owner than this repo), so GITHUB_TOKEN
      # cannot read it. GH_PACKAGES_TOKEN = repo secret, classic PAT read:packages.
      - name: Authenticate npm to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build (prisma generate + tsc)
        run: npm run build
